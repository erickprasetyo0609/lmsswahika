    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeJsAttr(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;")
        .replace(/\n/g, "\\n")
        .replace(/\r/g, "");
    }

    function formatTanggalID(dateStr) {
      if (!dateStr) return "-";
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return escapeHtml(dateStr);
      return d.toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" });
    }

    function normalizeExternalUrl(url) {
      if (!url) return "";
      const clean = String(url).trim();
      if (!clean) return "";
      if (/^(https?:\/\/|data:|blob:)/i.test(clean)) return clean;
      return "https://" + clean.replace(/^\/+/, "");
    }

      root.setProperty("--color-brand-accent", s.theme_accent || "#10b981");
      root.setProperty("--color-app-bg", s.theme_bg || "#f8fafc");
      root.setProperty("--color-card-bg", s.theme_card || "#ffffff");
      root.setProperty("--color-text-main", s.theme_text_main || "#0f172a");
      root.setProperty("--color-text-muted", s.theme_text_muted || "#64748b");
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute("content", s.theme_dark || "#073b27");
    }

    // =========================================================================
    // 5. STATE MANAGER & AUTO-SYNC LINTAS PERANGKAT (SUPABASE + LOCAL CACHE)
    // =========================================================================
    const STORAGE_KEY = "LMS_MA_MATHOLIUL_ANWAR_V3";
    let cloudSyncStatus = (!IS_PREVIEW && supabaseClient) ? "syncing" : "local";
    let isCloudPushing = false;
    let isCloudPulling = false;
    let realtimeDebounceTimer = null;

    class LMSStore {
      constructor() {
        this.loadState();
      }

      loadState() {
        try {
          const raw = sessionStorage.getItem(STORAGE_KEY) || localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            this.appSettings = { ...DEFAULT_APP_SETTINGS, ...(parsed.appSettings || {}) };
            this.classes = Array.isArray(parsed.classes) ? parsed.classes : JSON.parse(JSON.stringify(INITIAL_SEED_DATA.classes));
            this.teachers = Array.isArray(parsed.teachers) ? parsed.teachers : JSON.parse(JSON.stringify(INITIAL_SEED_DATA.teachers));
            this.students = Array.isArray(parsed.students) ? parsed.students : JSON.parse(JSON.stringify(INITIAL_SEED_DATA.students));
            this.subjects = Array.isArray(parsed.subjects) ? parsed.subjects : JSON.parse(JSON.stringify(INITIAL_SEED_DATA.subjects));
            this.materials = Array.isArray(parsed.materials) ? parsed.materials : JSON.parse(JSON.stringify(INITIAL_SEED_DATA.materials));
            this.assignments = Array.isArray(parsed.assignments) ? parsed.assignments : JSON.parse(JSON.stringify(INITIAL_SEED_DATA.assignments));
            this.submissions = Array.isArray(parsed.submissions) ? parsed.submissions : JSON.parse(JSON.stringify(INITIAL_SEED_DATA.submissions));
            applyAppTheme(this.appSettings);
            return;
          }
        } catch (err) {
          console.warn("Gagal membaca cache lokal, memuat data awal.", err);
        }
        this.resetToDefault(false);
      }

      saveLocalCache() {
        try {
          const serialized = JSON.stringify({
            appSettings: this.appSettings,
            classes: this.classes,
            teachers: this.teachers,
            students: this.students,
            subjects: this.subjects,
            materials: this.materials,
            assignments: this.assignments,
            submissions: this.submissions
          });
          sessionStorage.setItem(STORAGE_KEY, serialized);
          localStorage.setItem(STORAGE_KEY, serialized);
        } catch (err) {
          console.warn("Cache lokal penuh:", err);
        }
      }

      saveState(skipCloudPush = false) {
        this.saveLocalCache();
        if (!skipCloudPush && !IS_PREVIEW && supabaseClient) {
          this.pushToSupabase().catch(err => console.warn("Cloud push error:", err));
        }
      }

      async syncTableCollection(tableName, rows) {
        if (!supabaseClient) return;
        const { data: existingRows, error: fetchErr } = await supabaseClient.from(tableName).select("id");
        if (fetchErr) throw fetchErr;
        const currentIds = new Set(rows.map(r => r.id));
        const idsToDelete = (existingRows || []).map(r => r.id).filter(id => !currentIds.has(id));
        if (idsToDelete.length > 0) {
          await supabaseClient.from(tableName).delete().in("id", idsToDelete);
        }
        if (rows.length > 0) {
          const { error: upsertErr } = await supabaseClient.from(tableName).upsert(rows, { onConflict: "id" });
          if (upsertErr) throw upsertErr;
        }
      }

      async pushToSupabase() {
        if (IS_PREVIEW || !supabaseClient || isCloudPushing) return;
        isCloudPushing = true;
        cloudSyncStatus = "syncing";
        try {
          const settingsPayload = { id: 1, ...this.appSettings, updated_at: new Date().toISOString() };
          delete settingsPayload.created_at;
          await supabaseClient.from("app_settings").upsert(settingsPayload, { onConflict: "id" });

          const classRows = this.classes.map(c => ({
            id: c.id,
            name: c.name,
            academic_year: c.academic_year || this.appSettings.academic_year,
            homeroom_teacher: c.homeroom_teacher || ""
          }));
          await this.syncTableCollection("classes", classRows);

          const teacherRows = this.teachers.map(t => ({
            id: t.id,
            nip: t.nip,
            full_name: t.full_name,
            jabatan: t.jabatan || "",
            username: t.username,
            password: t.password
          }));
          await this.syncTableCollection("teachers", teacherRows);

          const validClassIds = new Set(classRows.map(c => c.id));
          const studentRows = this.students.map(s => ({
            id: s.id,
            nisn: s.nisn,
            full_name: s.full_name,
            username: s.username,
            password: s.password,
            class_id: s.class_id && validClassIds.has(s.class_id) ? s.class_id : null,
            class_name: s.class_name || "",
            gender: s.gender || "L",
            parent_phone: s.parent_phone || ""
          }));
          await this.syncTableCollection("students", studentRows);

          const validTeacherIds = new Set(teacherRows.map(t => t.id));
          const subjectRows = this.subjects.map(sub => ({
            id: sub.id,
            code: sub.code,
            name: sub.name,
            teacher_name: sub.teacher_name || "",
            teacher_id: sub.teacher_id && validTeacherIds.has(sub.teacher_id) ? sub.teacher_id : null
          }));
          await this.syncTableCollection("subjects", subjectRows);

          const validSubjectIds = new Set(subjectRows.map(sub => sub.id));
          const materialRows = this.materials.map(m => ({
            id: m.id,
            subject_id: m.subject_id && validSubjectIds.has(m.subject_id) ? m.subject_id : null,
            subject_name: m.subject_name || "",
            class_id: m.class_id && validClassIds.has(m.class_id) ? m.class_id : null,
            class_name: m.class_name || "",
            teacher_id: m.teacher_id && validTeacherIds.has(m.teacher_id) ? m.teacher_id : null,
            title: m.title,
            description: m.description || "",
            content_type: m.content_type || "Modul Ajar",
            links: Array.isArray(m.links) ? m.links : [],
            sub_materials: Array.isArray(m.sub_materials) ? m.sub_materials : [],
            completed_by: Array.isArray(m.completed_by) ? m.completed_by : [],
            created_at: m.created_at || new Date().toISOString().slice(0, 10)
          }));
          await this.syncTableCollection("materials", materialRows);

          const assignmentRows = this.assignments.map(a => ({
            id: a.id,
            subject_id: a.subject_id && validSubjectIds.has(a.subject_id) ? a.subject_id : null,
            subject_name: a.subject_name || "",
            class_id: a.class_id && validClassIds.has(a.class_id) ? a.class_id : null,
            class_name: a.class_name || "",
            teacher_id: a.teacher_id && validTeacherIds.has(a.teacher_id) ? a.teacher_id : null,
            title: a.title,
            instructions: a.instructions || "",
            deadline: a.deadline || "",
            max_score: Number(a.max_score) || 100
          }));
          await this.syncTableCollection("assignments", assignmentRows);

          const validAssignmentIds = new Set(assignmentRows.map(a => a.id));
          const validStudentIds = new Set(studentRows.map(s => s.id));
          const submissionRows = this.submissions
            .filter(sub => validAssignmentIds.has(sub.assignment_id) && validStudentIds.has(sub.student_id))
            .map(sub => ({
              id: sub.id,
              assignment_id: sub.assignment_id,
              student_id: sub.student_id,
              student_name: sub.student_name || "",
              submission_text: sub.submission_text || "",
              file_data: sub.file_data || "",
              file_name: sub.file_name || "",
              file_type: sub.file_type || "",
              file_url: sub.file_url || "",
              score: sub.score !== null && sub.score !== undefined && sub.score !== "" ? Number(sub.score) : null,
              feedback: sub.feedback || "",
              graded_by: sub.graded_by || "",
              graded_at: sub.graded_at || "",
              is_cancelled: Boolean(sub.is_cancelled),
              submitted_at: sub.submitted_at || ""
            }));
          await this.syncTableCollection("submissions", submissionRows);

          cloudSyncStatus = "connected";
        } catch (err) {
          cloudSyncStatus = "error";
          console.warn("Gagal menyinkronkan ke Supabase:", err);
        } finally {
          isCloudPushing = false;
        }
      }

      async pullFromSupabase(silent = true) {
        if (IS_PREVIEW || !supabaseClient || isCloudPulling || isCloudPushing) return;
        isCloudPulling = true;
        try {
          const [
            setRes,
            clsRes,
            tchRes,
            stdRes,
            subRes,
            matRes,
            asgRes,
            sbmRes
          ] = await Promise.all([
            supabaseClient.from("app_settings").select("*").eq("id", 1).maybeSingle(),
            supabaseClient.from("classes").select("*").order("created_at", { ascending: true }),
            supabaseClient.from("teachers").select("*").order("created_at", { ascending: true }),
            supabaseClient.from("students").select("*").order("created_at", { ascending: true }),
            supabaseClient.from("subjects").select("*").order("created_at", { ascending: true }),
            supabaseClient.from("materials").select("*").order("created_at", { ascending: false }),
            supabaseClient.from("assignments").select("*").order("created_at", { ascending: false }),
            supabaseClient.from("submissions").select("*")
          ]);

          if (setRes.error || clsRes.error || tchRes.error || stdRes.error) {
            throw setRes.error || clsRes.error || tchRes.error || stdRes.error;
          }

          // Jika database Supabase masih kosong saat pertama kali deploy, unggah data awal otomatis
          const isRemoteEmpty = !setRes.data && (!clsRes.data || clsRes.data.length === 0) && (!tchRes.data || tchRes.data.length === 0);
          if (isRemoteEmpty) {
            isCloudPulling = false;
            await this.pushToSupabase();
            return;
          }

          if (setRes.data) {
            const cleanSettings = { ...setRes.data };
            delete cleanSettings.id;
            delete cleanSettings.updated_at;
            this.appSettings = { ...DEFAULT_APP_SETTINGS, ...cleanSettings };
            applyAppTheme(this.appSettings);
          }
          if (Array.isArray(clsRes.data)) this.classes = clsRes.data;
          if (Array.isArray(tchRes.data)) this.teachers = tchRes.data;
          if (Array.isArray(stdRes.data)) this.students = stdRes.data;
          if (Array.isArray(subRes.data)) this.subjects = subRes.data;
          if (Array.isArray(matRes.data)) this.materials = matRes.data;
          if (Array.isArray(asgRes.data)) this.assignments = asgRes.data;
          if (Array.isArray(sbmRes.data)) this.submissions = sbmRes.data;

          // Perbarui sesi pengguna aktif jika datanya diubah oleh Admin dari perangkat lain
          if (typeof authUser !== "undefined" && authUser) {
            if (authUser.role === "siswa") {
              const latestStd = this.students.find(s => s.id === authUser.id);
              if (latestStd) authUser = { ...latestStd, role: "siswa" };
            } else if (authUser.role === "guru") {
              const latestTch = this.teachers.find(t => t.id === authUser.id);
              if (latestTch) authUser = { ...latestTch, role: "guru" };
            }
          }

          this.saveLocalCache();
          cloudSyncStatus = "connected";

          // Jangan timpa layar saat pengguna sedang mengetik di dalam modal atau halaman pengaturan
          const actionModal = document.getElementById("action-modal");
          const isModalOpen = actionModal && !actionModal.classList.contains("hidden");
          const isEditingSettings = typeof activeTab !== "undefined" && activeTab === "pengaturan" && authUser && authUser.role === "admin";
          if (!isModalOpen && !isEditingSettings && typeof renderApp === "function") {
            renderApp();
          }
          if (!silent) {
            showToast("Data terbaru berhasil disinkronkan dari server!", "success");
          }
        } catch (err) {
          cloudSyncStatus = "error";
          console.warn("Gagal mengambil pembaruan dari Supabase:", err);
        } finally {
          isCloudPulling = false;
        }
      }

      resetToDefault(shouldNotify = true) {
        const cloned = JSON.parse(JSON.stringify(INITIAL_SEED_DATA));
        this.appSettings = { ...DEFAULT_APP_SETTINGS, ...cloned.appSettings };
        this.classes = cloned.classes;
        this.teachers = cloned.teachers;
        this.students = cloned.students;
        this.subjects = cloned.subjects;
        this.materials = cloned.materials;
        this.assignments = cloned.assignments;
        this.submissions = cloned.submissions;
        this.saveState(false);
        applyAppTheme(this.appSettings);
        if (shouldNotify) {
          showToast("Data demo berhasil dikembalikan ke pengaturan awal.", "info");
          renderApp();
        }
      }
    }

    const store = new LMSStore();

    function initCrossDeviceRealtimeSync() {
      if (IS_PREVIEW || !supabaseClient) return;
      store.pullFromSupabase(true);

      const channel = supabaseClient
        .channel("lms-global-realtime-sync")
        .on("postgres_changes", { event: "*", schema: "public", table: "app_settings" }, () => scheduleRealtimePull())
        .on("postgres_changes", { event: "*", schema: "public", table: "classes" }, () => scheduleRealtimePull())
        .on("postgres_changes", { event: "*", schema: "public", table: "teachers" }, () => scheduleRealtimePull())
        .on("postgres_changes", { event: "*", schema: "public", table: "students" }, () => scheduleRealtimePull())
        .on("postgres_changes", { event: "*", schema: "public", table: "subjects" }, () => scheduleRealtimePull())
        .on("postgres_changes", { event: "*", schema: "public", table: "materials" }, () => scheduleRealtimePull())
        .on("postgres_changes", { event: "*", schema: "public", table: "assignments" }, () => scheduleRealtimePull())
        .on("postgres_changes", { event: "*", schema: "public", table: "submissions" }, () => scheduleRealtimePull())
        .subscribe((status) => {
          if (status === "SUBSCRIBED") {
            cloudSyncStatus = "connected";
          }
        });

      window.addEventListener("focus", () => store.pullFromSupabase(true));
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") store.pullFromSupabase(true);
      });
      setInterval(() => {
        if (document.visibilityState === "visible") store.pullFromSupabase(true);
      }, 20000);
      return channel;
    }

    function scheduleRealtimePull() {
      if (isCloudPushing) return;
      clearTimeout(realtimeDebounceTimer);
      realtimeDebounceTimer = setTimeout(() => {
        store.pullFromSupabase(true);
      }, 650);
    }

    function compressImageFile(file, maxWidth = 1200, quality = 0.78) {
      return new Promise((resolve) => {
        if (!file.type.startsWith("image/")) {
          const r = new FileReader();
          r.onload = (e) => resolve({ url: e.target.result, name: file.name, type: file.type });
          r.readAsDataURL(file);
          return;
        }
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL("image/jpeg", quality);
            resolve({ url: dataUrl, name: file.name, type: "image/jpeg" });
          };
          img.onerror = () => resolve({ url: event.target.result, name: file.name, type: file.type });
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function uploadFileToLmsStorage(file, folder = "umum") {
      if (!file) return null;
      if (file.size > 15 * 1024 * 1024) {
        showToast(`Ukuran berkas "${file.name}" melebihi batas maksimal 15 MB.`, "warning");
        return null;
      }
      const processed = await compressImageFile(file);
      if (!IS_PREVIEW && supabaseClient) {
        try {
          const res = await fetch(processed.url);
          const blob = await res.blob();
          const safeName = `${folder}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, "_")}`;
          const { error } = await supabaseClient.storage.from(STORAGE_BUCKET).upload(safeName, blob, { upsert: true });
          if (!error) {
            const { data: pubData } = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(safeName);
            if (pubData && pubData.publicUrl) {
              return { url: pubData.publicUrl, name: file.name, type: processed.type };
            }
          }
        } catch (err) {
          console.warn("Fallback ke penyimpanan lokal:", err);
        }
      }
      return processed;
    }

    window.extractYouTubeId = function(url) {
      if (!url) return null;
      const regExp = /(?:youtu\.be\/|youtube\.com\/(?:watch\?.*v=|embed\/|v\/|shorts\/|live\/))([^#\&\?\/]{11})/;
      const match = String(url).match(regExp);
      return match ? match[1] : null;
    };

    window.detectLinkCategory = function(url) {
      const clean = (url || "").trim();
      if (!clean) return { label: "Menunggu Tautan / Berkas", badge: "bg-slate-100 text-slate-500" };

    window.kumpulkanTautanData = async function(containerId, folder = "materi_guru") {
      const container = document.getElementById(containerId);
      if (!container) return [];
      const rows = Array.from(container.querySelectorAll(".smart-link-row"));
      const results = [];
      for (const row of rows) {
        const urlVal = (row.querySelector(".smart-link-url")?.value || "").trim();
        const titleVal = (row.querySelector(".smart-link-title")?.value || "").trim();
        const existingUploadedUrl = (row.querySelector(".smart-link-existing-url")?.value || "").trim();
        const fileInput = row.querySelector(".smart-link-file");

        if (fileInput && fileInput.files && fileInput.files[0]) {
          const uploaded = await uploadFileToLmsStorage(fileInput.files[0], folder);
          if (uploaded && uploaded.url) {
            results.push({ url: uploaded.url, title: titleVal || uploaded.name, file_type: uploaded.type || "", is_uploaded: true });
          }
        } else if (urlVal) {
          results.push({ url: normalizeExternalUrl(urlVal), title: titleVal || urlVal, is_uploaded: false });
        } else if (existingUploadedUrl) {
          results.push({ url: existingUploadedUrl, title: titleVal || "Berkas Terlampir", is_uploaded: true });
        }
      }
      return results;
    };

        t => ((t.username || "").trim().toLowerCase() === idInput.toLowerCase() || (t.nip || "").trim() === idInput) && (t.password || "").trim() === passInput

        s => ((s.username || "").trim().toLowerCase() === idInput.toLowerCase() || (s.nisn || "").trim() === idInput) && (s.password || "").trim() === passInput

    function getStudentMaterialTriState(material) {
      const hasRead = Array.isArray(material.completed_by) && material.completed_by.includes(authUser.id);
      const relatedAssignments = store.assignments.filter(
        a => (a.class_name === authUser.class_name || a.class_id === authUser.class_id) &&
             (a.subject_id === material.subject_id || (a.subject_name || "").toLowerCase() === (material.subject_name || "").toLowerCase())
      );
      const pendingAssignments = relatedAssignments.filter(
        a => !store.submissions.some(sub => sub.assignment_id === a.id && sub.student_id === authUser.id && !sub.is_cancelled)
      );

      if (!hasRead) {
        return { status: "red", label: "🔴 Belum Dibuka", badgeClass: "bg-red-50 text-red-700 border-red-200" };
      }
      if (pendingAssignments.length > 0) {
        return { status: "yellow", label: `🟡 Ada ${pendingAssignments.length} Tugas`, badgeClass: "bg-amber-50 text-amber-800 border-amber-200" };
      }
      return { status: "green", label: "🟢 Tuntas", badgeClass: "bg-emerald-50 text-emerald-700 border-emerald-200" };
    }

    function renderSiswaDashboard() {
      const cfg = store.appSettings;
      const myMaterials = store.materials.filter(m => m.class_name === authUser.class_name || m.class_id === authUser.class_id);
      const myAssignments = store.assignments.filter(a => a.class_name === authUser.class_name || a.class_id === authUser.class_id);

            <div onclick="switchTab('tugas')" class="cursor-pointer bg-white app-card-surface p-4 sm:p-5 rounded-3xl border border-slate-100 shadow-sm interactive-card">
              <span class="text-[11px] font-bold text-slate-500">Tugas Belum Selesai</span>
              <p class="text-2xl font-extrabold text-amber-600 mt-1">${pendingTasks.length}</p>
              <span class="text-[11px] text-slate-500">Dari ${myAssignments.length} Tugas</span>

            <div onclick="switchTab('tugas')" class="cursor-pointer bg-white app-card-surface p-4 sm:p-5 rounded-3xl border border-slate-100 shadow-sm interactive-card">
              <span class="text-[11px] font-bold text-slate-500">Tugas Terkumpul</span>
              <p class="text-2xl font-extrabold text-emerald-700 mt-1">${mySubmissions.length}</p>
              <span class="text-[11px] text-slate-500">Sudah Disetor</span>
            </div>
            <div onclick="switchTab('nilai')" class="cursor-pointer bg-white app-card-surface p-4 sm:p-5 rounded-3xl border border-slate-100 shadow-sm interactive-card">
              <span class="text-[11px] font-bold text-slate-500">Rapor Nilai</span>

              <span class="text-[11px] text-slate-500">Sudah Dinilai</span>

          ${pendingTasks.length > 0 ? `

              <div class="flex items-center justify-between">
                <h3 class="text-sm sm:text-base font-extrabold text-slate-900">Tugas Menunggu Dikerjakan (${pendingTasks.length})</h3>
                <button type="button" onclick="switchTab('tugas')" class="text-xs font-bold text-emerald-700 hover:underline">Lihat Semua →</button>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                ${pendingTasks.map(t => `
                  <div onclick="bukaDetailTugasSiswa('${t.id}')" class="cursor-pointer p-4 rounded-2xl bg-amber-50/60 border border-amber-200 hover:border-amber-400 transition flex items-center justify-between gap-3">
                    <div class="min-w-0">
                      <span class="text-[10px] font-extrabold uppercase text-amber-800">${escapeHtml(t.subject_name)}</span>
                      <p class="text-xs sm:text-sm font-extrabold text-slate-900 truncate mt-0.5">${escapeHtml(t.title)}</p>
                      <p class="text-[11px] text-red-600 font-semibold mt-0.5">Tenggat: ${formatTanggalID(t.deadline)}</p>
                    </div>
                    <span class="px-3 py-1.5 rounded-xl bg-emerald-700 text-white text-[11px] font-bold shrink-0">Kerjakan</span>
                  </div>
                `).join("")}

          ` : ""}

      `;

      const cfg = store.appSettings;
      const list = store.materials.filter(m => m.class_name === authUser.class_name || m.class_id === authUser.class_id);
      return `
        <div class="space-y-5 animate-fade-in">
          <div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900">${escapeHtml(cfg.siswa_materi_title)}</h2>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">${escapeHtml(cfg.siswa_materi_sub)}</p>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${list.length === 0 ? `<div class="col-span-full bg-white rounded-3xl p-8 text-center text-xs text-slate-500 border border-slate-100">Belum ada modul materi untuk kelas ${escapeHtml(authUser.class_name)}.</div>` : ""}
            ${list.map((m, idx) => {
              const pal = CARD_PALETTES[idx % CARD_PALETTES.length];

                    <span class="px-2.5 py-1 rounded-full border text-[11px] font-extrabold ${tri.badgeClass}">${tri.label}</span>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        </div>

    window.bukaMateri = function(materialId) {
      const m = store.materials.find(x => x.id === materialId);
      if (!m) return;
      if (authUser && authUser.role === "siswa") {
        if (!Array.isArray(m.completed_by)) m.completed_by = [];
        if (!m.completed_by.includes(authUser.id)) {
          m.completed_by.push(authUser.id);
          store.saveState();
        }
      }
      const subs = Array.isArray(m.sub_materials) ? m.sub_materials : [];
      const tri = authUser && authUser.role === "siswa" ? getStudentMaterialTriState(m) : null;

      openActionModal(m.title, `
        <div class="space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-100">
            <span class="px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-extrabold">${escapeHtml(m.subject_name)} • Kelas ${escapeHtml(m.class_name)}</span>
            ${tri ? `<span class="px-3 py-1 rounded-full border text-xs font-extrabold ${tri.badgeClass}">${tri.label}</span>` : ""}
          </div>

          <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200/80 space-y-2">
            <span class="text-[10px] font-extrabold uppercase tracking-wider text-emerald-700">Uraian Materi Utama</span>
            <p class="text-xs sm:text-sm text-slate-800 whitespace-pre-line leading-relaxed">${escapeHtml(m.description)}</p>
            ${renderSmartAttachmentHtml(m.links)}
          </div>

          ${subs.length > 0 ? `
            <div class="space-y-3">
              <h4 class="text-xs font-extrabold uppercase tracking-wider text-slate-600">Rincian Sub-Materi (${subs.length} Bagian)</h4>
              ${subs.map((sub, i) => `
                <div class="p-4 rounded-2xl bg-white border border-slate-200 shadow-sm space-y-2">
                  <div class="flex items-center gap-2">
                    <span class="w-6 h-6 rounded-lg bg-emerald-700 text-white text-xs font-extrabold flex items-center justify-center shrink-0">${i + 1}</span>
                    <h5 class="text-sm font-extrabold text-slate-900">${escapeHtml(sub.title)}</h5>
                  </div>
                  <p class="text-xs sm:text-sm text-slate-700 whitespace-pre-line leading-relaxed pl-8">${escapeHtml(sub.description)}</p>
                  <div class="pl-8">${renderSmartAttachmentHtml(sub.links)}</div>
                </div>
              `).join("")}
            </div>
          ` : ""}
        </div>
      `, "max-w-2xl");

      if (authUser && authUser.role === "siswa") {
        renderApp();
      }
    };

    function renderSiswaTugas() {
      const cfg = store.appSettings;
      const list = store.assignments.filter(a => a.class_name === authUser.class_name || a.class_id === authUser.class_id);
      return `
        <div class="space-y-5 animate-fade-in">
          <div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900">${escapeHtml(cfg.siswa_tugas_title)}</h2>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">${escapeHtml(cfg.siswa_tugas_sub)}</p>
          </div>

          <div class="space-y-3.5">
            ${list.length === 0 ? `<div class="bg-white rounded-3xl p-8 text-center text-xs text-slate-500 border border-slate-100">Belum ada penugasan untuk kelas ${escapeHtml(authUser.class_name)}.</div>` : ""}
            ${list.map((t, idx) => {
              const pal = CARD_PALETTES[idx % CARD_PALETTES.length];
              const sub = store.submissions.find(s => s.assignment_id === t.id && s.student_id === authUser.id);
              const isSubmitted = sub && !sub.is_cancelled;
              const isDraftCancelled = sub && sub.is_cancelled;
              return `
                <div onclick="bukaDetailTugasSiswa('${t.id}')" class="cursor-pointer bg-gradient-to-r ${pal.tint} app-card-surface rounded-3xl p-5 border border-slate-200/80 border-l-4 ${pal.border} shadow-sm interactive-card flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div class="min-w-0">
                    <div class="flex flex-wrap items-center gap-2 mb-1.5">
                      <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase ${pal.badge}">${escapeHtml(t.subject_name)}</span>
                      <span class="text-[11px] font-bold text-red-600">Tenggat: ${formatTanggalID(t.deadline)}</span>
                    </div>
                    <h3 class="text-base font-extrabold text-slate-900">${escapeHtml(t.title)}</h3>
                    <p class="text-xs text-slate-500 mt-1 line-clamp-2">${escapeHtml(t.instructions)}</p>
                  </div>
                  <div class="flex flex-wrap items-center gap-2 shrink-0">
                    ${isSubmitted ? `
                      ${sub.score !== null && sub.score !== undefined ? `<span class="px-3 py-1.5 rounded-xl bg-emerald-100 text-emerald-800 text-xs font-extrabold">Nilai: ${sub.score} / ${t.max_score || 100}</span>` : `<span class="px-3 py-1.5 rounded-xl bg-blue-50 text-blue-700 text-xs font-bold">Menunggu Dinilai</span>`}
                      <button type="button" onclick="event.stopPropagation(); bukaDetailTugasSiswa('${t.id}')" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold shadow-sm flex items-center gap-1.5">
                        <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Sudah Dikumpulkan
                      </button>
                    ` : isDraftCancelled ? `
                      <span class="px-2.5 py-1 rounded-xl bg-amber-100 text-amber-800 text-[11px] font-extrabold">Dibatalkan (Mode Edit)</span>
                      <button type="button" onclick="event.stopPropagation(); bukaDetailTugasSiswa('${t.id}')" class="px-4 py-2 rounded-xl bg-amber-600 hover:bg-amber-700 text-white text-xs font-extrabold shadow-sm">Perbarui Jawaban</button>
                    ` : `
                      <button type="button" onclick="event.stopPropagation(); bukaDetailTugasSiswa('${t.id}')" class="px-4 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-extrabold shadow-sm">Kerjakan Sekarang!</button>
                    `}
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    window.batalkanPengumpulanTugas = function(subId, assignmentId) {
      customConfirm(
        "Batalkan Pengumpulan Tugas?",
        "Status pengumpulan akan dibatalkan sementara agar Anda dapat mengedit dan memperbarui jawaban Anda.",
        () => {
          const sub = store.submissions.find(s => s.id === subId);
          if (sub) {
            sub.is_cancelled = true;
            store.saveState();
            showToast("Pengumpulan dibatalkan. Silakan perbarui jawaban Anda.", "info");
            renderApp();
            bukaDetailTugasSiswa(assignmentId);
          }
        }
      );
    };

    window.bukaDetailTugasSiswa = function(assignmentId) {
      const t = store.assignments.find(a => a.id === assignmentId);
      if (!t) return;
      const existingSub = store.submissions.find(s => s.assignment_id === t.id && s.student_id === authUser.id);
      const isLockedSubmitted = existingSub && !existingSub.is_cancelled;
      const isCancelledDraft = existingSub && existingSub.is_cancelled;

      openActionModal(t.title, `
        <div class="space-y-4">
          <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200">
            <div class="flex items-center justify-between text-xs mb-2">
              <span class="font-extrabold text-emerald-700">${escapeHtml(t.subject_name)}</span>
              <span class="font-bold text-red-600">Tenggat: ${formatTanggalID(t.deadline)}</span>
            </div>
            <p class="text-xs sm:text-sm text-slate-700 whitespace-pre-line leading-relaxed">${escapeHtml(t.instructions)}</p>
          </div>

          ${isLockedSubmitted ? `
            <div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-200 space-y-2">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <span class="inline-flex items-center gap-1.5 text-xs font-extrabold text-emerald-800">
                  <i data-lucide="check-circle-2" class="w-4 h-4"></i> Status: Sudah Dikumpulkan
                </span>
                <span class="text-[11px] font-semibold text-emerald-700">Dikirim: ${escapeHtml(existingSub.submitted_at || "-")}</span>
              </div>
              ${existingSub.score !== null && existingSub.score !== undefined ? `
                <div class="pt-2 border-t border-emerald-200/70">
                  <p class="text-xs font-extrabold text-emerald-900">Nilai Evaluasi: ${existingSub.score} / ${t.max_score || 100}</p>
                  ${existingSub.feedback ? `<p class="text-xs text-emerald-800 mt-0.5">Catatan Guru: "${escapeHtml(existingSub.feedback)}"</p>` : ""}
                </div>
              ` : ""}
            </div>

            <div class="space-y-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Jawaban Uraian yang Dikumpulkan</label>
                <div class="w-full px-3.5 py-3 text-xs rounded-xl bg-slate-50 border border-slate-200 text-slate-800 whitespace-pre-line min-h-[70px]">${existingSub.submission_text ? escapeHtml(existingSub.submission_text) : "<span class='text-slate-400 italic'>Tidak ada uraian teks</span>"}</div>
              </div>
              ${existingSub.file_data ? renderFilePreviewHtml(existingSub.file_data, existingSub.file_name, existingSub.file_type) : ""}
              ${existingSub.file_url && !existingSub.file_data ? renderSmartAttachmentHtml([{ url: existingSub.file_url, title: "Tautan Jawaban Terkirim" }]) : ""}
            </div>

            <div class="pt-2 border-t border-slate-100 flex flex-col sm:flex-row gap-2.5">
              <button type="button" onclick="batalkanPengumpulanTugas('${existingSub.id}', '${t.id}')" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-xs rounded-xl shadow-sm flex items-center justify-center gap-2 btn-press">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Batalkan Pengumpulan untuk Edit Jawaban
              </button>
            </div>
          ` : `
            ${isCancelledDraft ? `
              <div class="p-3 rounded-2xl bg-amber-50 border border-amber-200 text-xs text-amber-900 font-semibold flex items-center gap-2">
                <i data-lucide="edit-3" class="w-4 h-4 text-amber-600 shrink-0"></i>
                <span>Pengumpulan telah dibatalkan. Silakan ubah jawaban di bawah lalu klik <strong>Perbarui & Kirim Jawaban</strong>.</span>
              </div>
            ` : ""}

            <form id="siswa-submit-tugas-form" class="space-y-3.5">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Jawaban Uraian Teks</label>
                <textarea id="st-jawaban-teks" rows="4" placeholder="Ketik jawaban tugas Anda di sini..." class="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-600">${existingSub ? escapeHtml(existingSub.submission_text || "") : ""}</textarea>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Unggah Lampiran Foto / PDF (Opsional, otomatis dikompresi)</label>
                <input type="file" id="st-jawaban-file" accept="image/*,.pdf" class="w-full text-xs text-slate-600 file:mr-3 file:py-2 file:px-3.5 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Atau Tautan Google Drive / Link Jawaban (Opsional)</label>
                <input type="text" id="st-jawaban-url" value="${existingSub ? escapeHtml(existingSub.file_url || "") : ""}" placeholder="https://drive.google.com/..." class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-600" />
              </div>

              ${existingSub && existingSub.file_data ? renderFilePreviewHtml(existingSub.file_data, existingSub.file_name, existingSub.file_type) : ""}
              ${existingSub && existingSub.file_url && !existingSub.file_data ? renderSmartAttachmentHtml([{ url: existingSub.file_url, title: "Tautan Jawaban Sebelumnya" }]) : ""}

              <button type="submit" id="btn-kirim-jawaban" class="w-full py-3 bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold text-xs rounded-xl shadow-sm btn-press">
                ${isCancelledDraft ? "Perbarui & Kirim Jawaban" : "Kirim Tugas Sekarang"}
              </button>
            </form>
          `}
        </div>
      `, "max-w-xl");

      const formEl = document.getElementById("siswa-submit-tugas-form");
      if (formEl) {
        formEl.onsubmit = async function(e) {
          e.preventDefault();
          const btn = document.getElementById("btn-kirim-jawaban");
          if (btn) {
            btn.disabled = true;
            btn.textContent = "Mengunggah & Menyimpan...";
          }

          const textVal = document.getElementById("st-jawaban-teks").value.trim();
          const urlInputVal = normalizeExternalUrl(document.getElementById("st-jawaban-url").value.trim());
          const fileInput = document.getElementById("st-jawaban-file");
          let fileData = existingSub ? existingSub.file_data : "";
          let fileName = existingSub ? existingSub.file_name : "";
          let fileType = existingSub ? existingSub.file_type : "";
          let fileUrl = urlInputVal;

          if (fileInput && fileInput.files && fileInput.files[0]) {
            const uploaded = await uploadFileToLmsStorage(fileInput.files[0], "tugas_siswa");
            if (uploaded && uploaded.url) {
              fileData = uploaded.url;
              fileName = uploaded.name;
              fileType = uploaded.type;
              if (!fileUrl) fileUrl = uploaded.url;
            }
          }

          if (!textVal && !fileData && !fileUrl) {
            showToast("Isi jawaban teks, lampirkan berkas, atau masukkan tautan terlebih dahulu!", "warning");
            if (btn) {
              btn.disabled = false;
              btn.textContent = isCancelledDraft ? "Perbarui & Kirim Jawaban" : "Kirim Tugas Sekarang";
            }
            return;
          }

          const nowStr = new Date().toLocaleString("id-ID", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
          if (existingSub) {
            existingSub.submission_text = textVal;
            existingSub.file_data = fileData;
            existingSub.file_name = fileName;
            existingSub.file_type = fileType;
            existingSub.file_url = fileUrl;
            existingSub.submitted_at = nowStr;
            existingSub.is_cancelled = false;
          } else {
            store.submissions.push({
              id: "subm_" + Date.now(),
              assignment_id: t.id,
              student_id: authUser.id,
              student_name: authUser.full_name,
              submission_text: textVal,
              file_data: fileData,
              file_name: fileName,
              file_type: fileType,
              file_url: fileUrl,
              score: null,
              feedback: "",
              graded_by: "",
              graded_at: "",
              is_cancelled: false,
              submitted_at: nowStr
            });
          }

          store.saveState();
          closeActionModal();
          showToast(isCancelledDraft ? "Jawaban berhasil diperbarui & dikumpulkan!" : "Tugas berhasil dikumpulkan!", "success");
          renderApp();
        };
      }
    };

    function renderSiswaNilai() {
      const cfg = store.appSettings;
      const mySubmissions = store.submissions.filter(s => s.student_id === authUser.id && !s.is_cancelled);
      return `
        <div class="space-y-5 animate-fade-in">
          <div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900">${escapeHtml(cfg.siswa_nilai_title)}</h2>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">${escapeHtml(cfg.siswa_nilai_sub)} • Klik baris nilai untuk melihat detail koreksi guru.</p>
          </div>
          <div class="bg-white app-card-surface rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>

    window.bukaDetailNilaiSiswa = function(subId) {
      const sub = store.submissions.find(s => s.id === subId);
      if (!sub) return;
      const asg = store.assignments.find(a => a.id === sub.assignment_id) || {};
      const mapelObj = store.subjects.find(s => s.id === asg.subject_id || (s.name || "").toLowerCase() === (asg.subject_name || "").toLowerCase());
      const teacherObj = store.teachers.find(t => t.id === asg.teacher_id);
      const guruMapelName = sub.graded_by || (mapelObj ? mapelObj.teacher_name : (teacherObj ? teacherObj.full_name : "Guru Mata Pelajaran"));
      const isGraded = sub.score !== null && sub.score !== undefined;
      const maxS = Number(asg.max_score) || 100;
      const statusText = isGraded
        ? (Number(sub.score) >= 75 ? "Tuntas / Lulus Kriteria" : "Sudah Dinilai (Perlu Pengayaan)")
        : "Menunggu Koreksi Guru Mapel";
      const statusBadgeCls = isGraded
        ? (Number(sub.score) >= 75 ? "bg-emerald-100 text-emerald-800 border-emerald-300" : "bg-amber-100 text-amber-800 border-amber-300")
        : "bg-blue-50 text-blue-800 border-blue-200";

      openActionModal(`Detail Nilai: ${asg.subject_name || "Mata Pelajaran"}`, `
        <div class="space-y-4">
          <div class="p-5 rounded-2xl bg-gradient-to-br from-emerald-50 to-white border border-emerald-200 flex items-center justify-between gap-4">
            <div>
              <span class="px-2.5 py-0.5 rounded-full bg-emerald-700 text-white text-[10px] font-extrabold uppercase">${escapeHtml(asg.subject_name || "-")}</span>
              <h4 class="text-base font-extrabold text-slate-900 mt-1.5">${escapeHtml(asg.title || "-")}</h4>
              <span class="inline-block mt-2 px-3 py-1 rounded-full text-[11px] font-extrabold border ${statusBadgeCls}">${statusText}</span>
            </div>
            <div class="text-center px-4 py-3 rounded-2xl bg-white border border-emerald-200 shadow-sm shrink-0">
              <span class="block text-[10px] font-bold uppercase text-slate-400">Skor Akhir</span>
              <span class="text-2xl font-black ${isGraded ? "text-emerald-700" : "text-slate-400"}">${isGraded ? sub.score : "-"}</span>
              <span class="block text-[10px] font-bold text-slate-500">dari ${maxS}</span>
            </div>
          </div>

          <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-2.5 text-xs">
            <div class="flex items-center justify-between py-1 border-b border-slate-200/70">
              <span class="text-slate-500 font-semibold">Guru Mapel Pengoreksi</span>
              <span class="font-extrabold text-slate-900">${escapeHtml(guruMapelName)}</span>
            </div>
            <div class="flex items-center justify-between py-1 border-b border-slate-200/70">
              <span class="text-slate-500 font-semibold">Waktu Dikoreksi (Tanggal & Jam)</span>
              <span class="font-extrabold text-emerald-700">${isGraded ? escapeHtml(sub.graded_at || sub.submitted_at || "-") : "Belum dikoreksi"}</span>
            </div>
            <div class="flex items-center justify-between py-1 border-b border-slate-200/70">
              <span class="text-slate-500 font-semibold">Waktu Pengumpulan Siswa</span>
              <span class="font-bold text-slate-700">${escapeHtml(sub.submitted_at || "-")}</span>
            </div>
            <div class="pt-1">
              <span class="text-slate-500 font-semibold block mb-1">Catatan / Umpan Balik Guru:</span>
              <div class="p-3 rounded-xl bg-white border border-slate-200 text-slate-700 italic">

    };

    window.simpanNilaiSiswa = function(subId, assignmentId) {
      const sub = store.submissions.find(s => s.id === subId);
      const t = store.assignments.find(a => a.id === assignmentId);
      if (!sub || !t) return;
      const rawScore = document.getElementById(`score-in-${subId}`).value;
      const numScore = Number(rawScore);
      const maxS = Number(t.max_score) || 100;
      if (rawScore === "" || isNaN(numScore) || numScore < 0 || numScore > maxS) {
        showToast(`Masukkan nilai valid antara 0 hingga ${maxS}!`, "warning");
        return;
      }
      sub.score = numScore;
      sub.feedback = document.getElementById(`fb-in-${subId}`).value.trim();
      sub.graded_by = authUser ? authUser.full_name : "Guru Mapel";
      sub.graded_at = new Date().toLocaleString("id-ID", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
      store.saveState();
      showToast(`Nilai ${sub.student_name} (${numScore}) tersimpan!`, "success");
      renderApp();
    };

    window.downloadTemplateExcelSiswa = function() {
      if (!window.XLSX) return;
      const ws = XLSX.utils.json_to_sheet([
        { NISN: "0091112221", Nama: "Ahmad Zaki", Kelas: "X.6", Username: "ahmad_zaki", Password: "123", WhatsApp: "6281234567890" }
      ]);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "TemplateSiswa");
      XLSX.writeFile(wb, "Template_Impor_Siswa_LMS.xlsx");
    };

    window.prosesImporExcelSiswa = function() {
      const input = document.getElementById("excel-siswa-input");
      if (!input || !input.files || !input.files[0]) {
        showToast("Pilih berkas Excel (.xlsx) terlebih dahulu!", "warning");
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        const wb = XLSX.read(e.target.result, { type: "binary" });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
        let added = 0;
        rows.forEach((r, idx) => {
          const nisn = String(r.NISN || "").trim();
          const nama = String(r.Nama || "").trim();
          const kelas = String(r.Kelas || "X.6").trim();
          if (!nisn || !nama || store.students.some(s => s.nisn === nisn)) return;
          const cObj = store.classes.find(c => c.name === kelas);
          store.students.push({
            id: "s_imp_" + Date.now() + "_" + idx,
            nisn,
            full_name: nama,
            username: String(r.Username || nisn).trim(),
            password: String(r.Password || "123").trim(),
            class_id: cObj ? cObj.id : "",
            class_name: kelas,
            gender: "L",
            parent_phone: String(r.WhatsApp || "").trim()
          });
          added++;
        });
        store.saveState();
        closeActionModal();
        showToast(`Berhasil mengimpor ${added} data siswa baru!`, "success");
        renderApp();
      };
      reader.readAsBinaryString(input.files[0]);
    };

    function renderAdminLaporan() {
      let filtered = store.students;
      if (adminLaporanFilterKelas !== "semua") {
        filtered = filtered.filter(s => s.class_name === adminLaporanFilterKelas);
      }
      if (adminLaporanSearch.trim()) {
        const q = adminLaporanSearch.trim().toLowerCase();
        filtered = filtered.filter(s =>
          (s.full_name || "").toLowerCase().includes(q) ||
          (s.nisn || "").toLowerCase().includes(q)
        );
      }

      return `
        <div class="space-y-5 animate-fade-in">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 no-print">
            <div>
              <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900">Rekapitulasi Laporan Nilai Siswa</h2>
              <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Pantau capaian tugas, nilai rata-rata, dan cetak transkrip laporan akademik.</p>
            </div>
            <button type="button" onclick="window.print()" class="px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-xl shadow-sm shrink-0">
              Cetak Laporan (PDF / Print)
            </button>
          </div>

          <div class="flex flex-col sm:flex-row gap-2.5 no-print">
            <input type="text" value="${escapeHtml(adminLaporanSearch)}" oninput="adminLaporanSearch=this.value; renderApp()" placeholder="Cari nama siswa atau NISN..." class="flex-1 px-4 py-2.5 text-xs rounded-xl bg-white border border-slate-200 focus:outline-none focus:border-emerald-600" />
            <select onchange="adminLaporanFilterKelas=this.value; renderApp()" class="px-3.5 py-2.5 text-xs font-bold rounded-xl bg-white border border-slate-200">
              <option value="semua">Semua Rombel Kelas</option>
              ${store.classes.map(c => `<option value="${escapeHtml(c.name)}" ${adminLaporanFilterKelas === c.name ? "selected" : ""}>Kelas ${escapeHtml(c.name)}</option>`).join("")}
            </select>
          </div>

          <div class="bg-white app-card-surface rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-slate-50 text-[11px] font-extrabold uppercase text-slate-500 border-b border-slate-100">
                    <th class="p-4">NISN</th>
                    <th class="p-4">Nama Siswa</th>
                    <th class="p-4">Kelas</th>
                    <th class="p-4">Capaian Tugas</th>
                    <th class="p-4">Rata-Rata Nilai</th>
                    <th class="p-4">Status</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-xs">
                  ${filtered.length === 0 ? `<tr><td colspan="6" class="p-8 text-center text-slate-400">Tidak ada data laporan yang cocok.</td></tr>` : ""}
                  ${filtered.map(st => {
                    const classAsgs = store.assignments.filter(a => a.class_name === st.class_name || a.class_id === st.class_id);
                    const stSubs = store.submissions.filter(sub => sub.student_id === st.id && !sub.is_cancelled && classAsgs.some(a => a.id === sub.assignment_id));
                    const gradedSubs = stSubs.filter(sub => sub.score !== null && sub.score !== undefined);
                    const avg = gradedSubs.length > 0 ? Math.round(gradedSubs.reduce((acc, cur) => acc + Number(cur.score), 0) / gradedSubs.length) : "-";

                    let statusBadge = `<span class="px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 font-bold text-[10px]">Belum Ada Tugas</span>`;
                    if (classAsgs.length > 0) {
                      if (stSubs.length === 0) {
                        statusBadge = `<span class="px-2.5 py-0.5 rounded-full bg-red-50 text-red-700 font-bold text-[10px]">Belum Setor</span>`;
                      } else if (stSubs.length < classAsgs.length) {
                        statusBadge = `<span class="px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-800 font-bold text-[10px]">Sebagian</span>`;
                      } else {
                        statusBadge = `<span class="px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 font-extrabold text-[10px]">✓ Tuntas</span>`;
                      }
                    }

                    return `
                      <tr class="hover:bg-slate-50/60">
                        <td class="p-4 font-mono text-slate-600">${escapeHtml(st.nisn)}</td>
                        <td class="p-4 font-extrabold text-slate-900">${escapeHtml(st.full_name)}</td>
                        <td class="p-4"><span class="px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-700 font-bold text-[11px]">${escapeHtml(st.class_name)}</span></td>
                        <td class="p-4 font-bold text-slate-700">${stSubs.length} / ${classAsgs.length} Tugas</td>
                        <td class="p-4 font-extrabold text-blue-700">${avg}</td>
                        <td class="p-4">${statusBadge}</td>
                      </tr>
                    `;
                  }).join("")}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

      if (!input.files || !input.files[0]) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const box = document.getElementById("logo-preview-box");
        if (box) {
          box.innerHTML = `<img src="${e.target.result}" alt="Pratinjau Logo" class="w-full h-full object-contain p-1" />`;
        }
      };
      reader.readAsDataURL(input.files[0]);

    function renderMainContent() {
      if (authUser.role === "siswa") {
        if (activeTab === "materi") return renderSiswaMateri();
        if (activeTab === "tugas") return renderSiswaTugas();
        if (activeTab === "nilai") return renderSiswaNilai();
        return renderSiswaDashboard();
      }
      if (authUser.role === "guru") {
        if (activeTab === "kelas") return renderGuruKelas();
        if (activeTab === "materi") return renderGuruMateri();
        if (activeTab === "tugas") return renderGuruTugas();
        if (activeTab === "walikelas") return renderGuruWaliKelas();
        return renderGuruDashboard();
      }
      if (activeTab === "kelas") return renderAdminKelas();
      if (activeTab === "siswa") return renderAdminSiswa();
      if (activeTab === "guru") return renderAdminGuru();
      if (activeTab === "mapel") return renderAdminMapel();
      if (activeTab === "asesmen") return renderAdminAsesmen();
      if (activeTab === "laporan") return renderAdminLaporan();
      if (activeTab === "pengaturan") return renderAdminPengaturan();
      return renderAdminDashboard();
    }

              <div class="flex items-center gap-2.5 lg:hidden">
                ${logoHtml}
                <span class="font-extrabold text-xs text-slate-900 truncate max-w-[170px]">${escapeHtml(s.school_name)}</span>
              </div>
              <div class="hidden lg:flex items-center gap-2 text-xs font-semibold text-slate-500">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Portal Akademik Digital • <strong class="text-slate-800">${escapeHtml(authUser.full_name)}</strong></span>
              </div>
              <div class="flex items-center gap-2.5">
                ${authUser.role === "admin" ? `<button type="button" onclick="switchTab('pengaturan')" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-bold transition"><i data-lucide="sliders-horizontal" class="w-3.5 h-3.5 text-fuchsia-600"></i> Atur Teks & Tampilan</button>` : ""}
                <span class="px-3 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200/70 text-[11px] font-extrabold uppercase">${escapeHtml(authUser.role)}</span>
                <button type="button" onclick="logoutUser()" class="lg:hidden p-2 rounded-xl bg-slate-100 text-slate-700 hover:bg-red-50 hover:text-red-600" aria-label="Keluar">
                  <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
              </div>
            </header>

            <main class="flex-1 p-4 sm:p-8 max-w-6xl w-full mx-auto">
              ${renderMainContent()}
            </main>
          </div>

          <nav class="lg:hidden fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-md app-card-surface border-t border-slate-200 px-1.5 py-1.5 flex items-center justify-around z-30 no-print overflow-x-auto shadow-lg">
            ${menus.map(m => {
              const isActive = activeTab === m.id;
              return `
                <button type="button" onclick="switchTab('${m.id}')" class="mobile-nav-item ${isActive ? `is-active ${m.mobileColor || "text-emerald-700"} font-extrabold bg-slate-100/80` : "text-slate-500 font-semibold"} relative flex flex-col items-center justify-center py-1.5 px-2.5 rounded-2xl min-w-[58px]">
                  <i data-lucide="${m.icon}" class="mobile-nav-icon w-4 h-4 mb-0.5 ${isActive ? (m.mobileColor || "text-emerald-700") : ""}"></i>
                  <span class="text-[10px] truncate max-w-[66px]">${escapeHtml(m.mobileLabel || m.label)}</span>
                  ${m.badge > 0 ? `<span class="absolute top-1 right-2 w-4 h-4 rounded-full bg-amber-500 text-white text-[9px] font-extrabold flex items-center justify-center animate-bounce">${m.badge}</span>` : ""}
                </button>
              `;
            }).join("")}
          </nav>
        </div>
      `;

      if (activeTab === "pengaturan" && authUser.role === "admin") {
        bindAdminSettingsForm();
      }
      if (window.lucide) lucide.createIcons();
    };

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        const confirmModal = document.getElementById("confirm-modal");
        if (confirmModal && !confirmModal.classList.contains("hidden")) {
          confirmModal.classList.add("hidden");
          confirmModal.classList.remove("flex");
          return;
        }
        const actionModal = document.getElementById("action-modal");
        if (actionModal && !actionModal.classList.contains("hidden")) {
          closeActionModal();
        }
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      renderApp();
      initCrossDeviceRealtimeSync();
    });
  </script>
</body>
</html>
